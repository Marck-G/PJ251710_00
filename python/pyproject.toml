[tool.poetry]
name = "sgd-python"
version = "0.1.0"
description = "Python microservices for Sistema de Gestión Documental"
authors = ["Equipo SGD <dev@sgd.local>"]
packages = [{ include = "gateway_api" },  { include = "report_service" }]

[tool.poetry.dependencies]
python = "^3.11"
psycopg-binary = "^3.2.11"
fastapi = "^0.119.1"
uvicorn = "^0.38.0"
aio-pika = "^9.5.7"
requests = "^2.32.5"
pydantic = "^2.12.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
black = "^25.9.0"
flake8 = "^7.3.0"
mypy = "^1.18.2"
datamodel-code-generator = "^0.35.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
